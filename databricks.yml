# This is a Databricks asset bundle definition for grupo10.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grupo10
  uuid: 91df96da-8a72-438c-9944-e80f4e6ad10b

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-520ccaae-996e.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-520ccaae-996e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/leonardo.zoot@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/leonardo.zoot@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: leonardo.zoot@gmail.com
        level: CAN_MANAGE

