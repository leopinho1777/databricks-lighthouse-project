# This is a Databricks asset bundle definition for grupo10.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grupo10
  uuid: 91df96da-8a72-438c-9944-e80f4e6ad10b

include:
    - resources/*.yml
    - databricks.local.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

sync:
  include:
  - "src/**"

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}  # each person gets their own schema
      #'host' precisar ser configurado num databricks.local.yml para sobrescrever o databricks.yml que deve ser compartilhado entre todos

  prod:
    mode: production
    workspace:
      host: https://dbc-520ccaae-996e.cloud.databricks.com
      root_path: /Workspace/Users/leonardo.zoot@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: leonardo.zoot@gmail.com
        level: CAN_MANAGE