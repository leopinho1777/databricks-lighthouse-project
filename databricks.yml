bundle:
  name: grupo10
  uuid: 91df96da-8a72-438c-9944-e80f4e6ad10b
include:
    - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev_pessoal:
    mode: development
    default: true
    workspace:
      host: https://dbc-7d19c6f6-62b8.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}

  dev_eva:
    mode: development
    default: false
    workspace:
      host: https://dbc-fce119b6-bd5a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}

  dev:
    mode: development
    default: false
    workspace:
      host: https://dbc-fc67e327-d40e.cloud.databricks.co
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}

  prod:
    mode: production
    workspace:
      host: https://dbc-520ccaae-996e.cloud.databricks.com
      root_path: /Workspace/Users/leonardo.zoot@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: leonardo.zoot@gmail.com
        level: CAN_MANAGE