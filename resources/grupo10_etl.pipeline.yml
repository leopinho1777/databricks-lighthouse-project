# The main pipeline for grupo10

resources:
  pipelines:
    grupo10_etl:
      name: grupo10_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      
      # Definimos a raiz como a pasta 'src'
      root_path: "../src"

      # O DLT só precisa saber qual é o ponto de entrada do código
      libraries:
        - notebook:
            path: ../src/sqlserver_ingest.ipynb
      environment:
        dependencies:

          - --editable ${workspace.file_path}
