# The main pipeline for grupo10

resources:
  pipelines:
    grupo10_etl:
      name: grupo10_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/grupo10_etl"

      libraries:
        - glob:
            include: ../src/grupo10_etl/transformations/**
      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
