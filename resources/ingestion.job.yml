resources:
  jobs:
    ingestion:
      name: SQL Server Ingestion
      tasks:
        # Task 1: setup — creates catalog/schema, audit/control tables, publishes table list
        - task_key: setup
          notebook_task:
            notebook_path: ../src/sqlserver_ingest_setup.ipynb
            source: WORKSPACE
          environment_key: Default

        # Task 2: for each table published by setup, run the ingestion notebook
        - task_key: ingest_tables
          depends_on:
            - task_key: setup           # waits for setup to finish
          for_each_task:
            inputs: "{{tasks.setup.values.tables}}"   # consumes the taskValue set in setup
            concurrency: 5
            task:
              task_key: ingest_single_table
              notebook_task:
                notebook_path: ../src/sqlserver_ingest.ipynb
                source: WORKSPACE
                base_parameters:
                  table_config: "{{input}}"   # full table config object: {name, primary_key}
              environment_key: Default

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
