[project]
name = "grupo10"
version = "0.0.1"
authors = [{ name = "leonardo.zoot@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "jupyterlab>=4.6.0",
    "jupytext>=1.19.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]
forecasting = [
    "databricks-sql-connector>=4.5.0",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "mlflow-skinny>=2.17.0",
]

[project.scripts]
main = "grupo10.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/grupo10"]
