version: 2

snapshots:
  - name: snap_stock_levels
    description: SCD Type 2 history of stg_stock_levels (timestamp strategy on updated_at, keyed on stock_level_id, hard deletes invalidated). Feeds fct_daily_stock_levels.
    columns:
      - name: stock_level_id
        description: MD5 surrogate key built from product_variant_id and location_id, used as the snapshot unique key.
      - name: product_variant_id
        description: Product variant in stock.
      - name: location_id
        description: Location holding the stock.
      - name: quantity_on_hand
        description: Quantity in stock during this version of the row.
      - name: updated_at
        description: Timestamp of the source update that produced this version.
      - name: _ingested_at
        description: Timestamp when the row was loaded into Bronze.
      - name: _source_origin
        description: Name of the source table the row was loaded from.
      - name: _batch_id
        description: Identifier of the ingestion batch that loaded the row.
      - name: dbt_scd_id
        description: Unique identifier of this version, generated by dbt.
      - name: dbt_updated_at
        description: Value of updated_at used by dbt to detect changes.
      - name: dbt_valid_from
        description: Timestamp from which this version of the row is valid.
      - name: dbt_valid_to
        description: Timestamp until which this version was valid; null for the current version.
