version: 2

models:
  - name: stg_categories
    description: Product categories and taxonomy hierarchy standardized from bronze.
    columns:
      - name: category_id
        description: Category primary key.
        data_tests:
          - not_null
          - unique
      - name: parent_category_id
        description: Foreign key to parent category for hierarchical subcategories.
      - name: category_name
        description: Display name of the category.
        data_tests:
          - not_null
      - name: slug
        description: URL-friendly identifier for the category.
      - name: is_active
        description: Boolean flag indicating if the category is active.
      - name: created_at
        description: Record creation timestamp.
      - name: updated_at
        description: Record last update timestamp.
      - name: _ingested_at
        description: Ingestion timestamp.
        data_tests:
          - not_null
      - name: _source_origin
        description: Source system identifier.
        data_tests:
          - not_null
      - name: _batch_id
        description: Ingestion batch identifier.
        data_tests:
          - not_null
