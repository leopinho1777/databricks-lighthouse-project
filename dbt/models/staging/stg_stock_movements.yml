version: 2

models:
  - name: stg_stock_movements
    description: Stock movement transactions standardized from bronze.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(movement_type in ('purchase_in', 'return_in') and quantity > 0 and is_zero_quantity_movement = false) or (movement_type in ('sale_out', 'return_out') and quantity < 0 and is_zero_quantity_movement = false) or (quantity = 0 and is_zero_quantity_movement = true)"
          config:
            severity: warn
    columns:
      - name: stock_movement_id
        description: Stock movement key.
        data_tests:
          - not_null
          - unique
      - name: product_variant_id
        description: Related product variant key.
        data_tests:
          - not_null
      - name: location_id
        description: Related location key.
        data_tests:
          - not_null
      - name: employee_id
        description: Employee responsible for the stock movement.
      - name: reference_id
        description: Identifier of the source document driving the movement.
      - name: reference_table
        description: Source table or document type of the movement reference.
      - name: movement_type
        description: Normalized stock movement type used to infer quantity sign.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['purchase_in', 'sale_out', 'return_in', 'return_out']
      - name: quantity
        description: Quantity moved.
        data_tests:
          - not_null
      - name: is_zero_quantity_movement
        description: Flag indicating whether the raw movement quantity was zero.
        data_tests:
          - not_null
      - name: occurred_at
        description: Stock movement timestamp.
        data_tests:
          - not_null
          - no_future_dates
      - name: notes
        description: Free-text notes recorded for the movement.
      - name: created_at
        description: Record creation timestamp.
      - name: _ingested_at
        description: Ingestion timestamp.
        data_tests:
          - not_null
      - name: _source_origin
        description: Source system identifier.
        data_tests:
          - not_null
      - name: _batch_id
        description: Ingestion batch identifier.
        data_tests:
          - not_null
