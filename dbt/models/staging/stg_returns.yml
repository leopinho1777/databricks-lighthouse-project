version: 2

models:
  - name: stg_returns
    description: Returns master data standardized from bronze.
    columns:
      - name: return_id
        description: Return primary key.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Order identifier associated with the return.
        data_tests:
          - not_null
      - name: customer_id
        description: Customer who initiated the return.
      - name: received_at_location_id
        description: Location where the returned goods were received.
      - name: return_number
        description: Human-readable return reference number.
      - name: status
        description: Current status of the return.
      - name: reason
        description: Normalised reason category for the return.
      - name: total_refund_amount
        description: Total refund amount issued for the return.
      - name: created_at
        description: Record creation timestamp.
        data_tests:
          - not_null
          - no_future_dates
      - name: updated_at
        description: Record last update timestamp.
      - name: _ingested_at
        description: Ingestion timestamp.
        data_tests:
          - not_null
      - name: _source_origin
        description: Source system identifier.
        data_tests:
          - not_null
      - name: _batch_id
        description: Ingestion batch identifier.
        data_tests:
          - not_null
