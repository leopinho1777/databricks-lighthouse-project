version: 2

models:
  - name: fct_sales
    description: >
      Sales fact at order-item grain. One record per order item, with foreign
      keys to the dimensions and additive measures (quantity, prices, taxes).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "quantity > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "unit_price > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "line_total > 0"
    columns:
      - name: sales_sk
        description: Surrogate key of the sales fact (hash of order_item_id).
        data_tests:
          - not_null
          - unique
      - name: order_item_id
        description: Natural / degenerate key — order item identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Parent order identifier (degenerate dimension).
        data_tests:
          - not_null
      - name: customer_sk
        description: Surrogate key to the customer dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
              config:
                severity: warn
      - name: customer_id
        description: Natural key — customer identifier for traceability.
        data_tests:
          - not_null
      - name: quantity
        description: Ordered quantity (additive measure).
        data_tests:
          - not_null
      - name: line_total
        description: Line total amount (additive measure).
        data_tests:
          - not_null
      - name: salesperson_sk
        description: Surrogate key to the salesperson/employee dimension. Nullable — ecommerce orders may have none.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employees')
                field: employee_sk
              config:
                severity: warn
      - name: salesperson_id
        description: Foreign key to the employee dimension (salesperson). Nullable — ecommerce orders may have none.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employees')
                field: employee_id
              config:
                severity: warn
      - name: location_sk
        description: Surrogate key to the location dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_sk
              config:
                severity: warn
      - name: location_id
        description: Location where the order was placed (FK to dim_locations).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_id
              config:
                severity: warn
      - name: product_sk
        description: Surrogate key to the product dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_sk
              config:
                severity: warn
      - name: product_variant_id
        description: Natural key of the product variant for traceability.
        data_tests:
          - not_null
      - name: channel
        description: Sales channel (degenerate dimension) — e.g., ecommerce, physical store.
        data_tests:
          - not_null
      - name: order_status
        description: >
          Status of the parent order. Only 'paid' and 'confirmed' are treated as
          valid revenue by the aggregate models; 'cancelled' and 'draft' are excluded.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'confirmed', 'cancelled', 'draft']
      - name: placed_at
        description: Timestamp when the order was placed (links to the date dimension).
        data_tests:
          - not_null
      - name: unit_price
        description: Unit price of the order item (measure).
        data_tests:
          - not_null
      - name: icms_rate
        description: ICMS tax rate applied to the item.
      - name: ipi_rate
        description: IPI tax rate applied to the item.
      - name: date_id
        description: >
          Foreign key to the date dimension (integer format YYYYMMDD). Falls back to
          19000101 when placed_at is null. That key has no match in dim_calendary,
          so such rows are reported by the relationships test and land in the blank
          row of the relationship in Power BI.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendary')
                field: date_id
              config:
                severity: warn
      - name: payment_method
        description: Primary payment method used for the order (deduplicated by highest amount).