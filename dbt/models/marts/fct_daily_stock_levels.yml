version: 2

models:
  - name: fct_daily_stock_levels
    description: Sparse daily stock fact built from stock level snapshots. One row per stock change day and product-location pair.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - stock_level_day
              - product_variant_id
              - location_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "physical_quantity_on_hand = greatest(raw_quantity_on_hand, 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stock_level_day = cast(snapshot_valid_from as date)"
    columns:
      - name: stock_level_day
        description: Day where the snapshot change became valid.
        data_tests:
          - not_null
      - name: product_sk
        description: Surrogate key to the product dimension.
        data_tests:
          - not_null
      - name: product_variant_id
        description: Natural key of the product variant for traceability.
        data_tests:
          - not_null
      - name: location_sk
        description: Surrogate key to the location dimension.
        data_tests:
          - not_null
      - name: location_id
        description: Natural key of the location for traceability.
        data_tests:
          - not_null
      - name: stock_level_id
        description: Surrogate stock level key from staging.
        data_tests:
          - not_null
      - name: raw_quantity_on_hand
        description: Raw quantity captured from snapshot history.
        data_tests:
          - not_null
      - name: physical_quantity_on_hand
        description: Non-negative quantity used for operational stock analytics.
        data_tests:
          - not_null
      - name: is_negative_raw_quantity
        description: Flag indicating the source quantity was negative.
        data_tests:
          - not_null
      - name: zero_quantity_movement_count
        description: Number of staged stock movements on the same day and product-location pair with zero quantity.
        data_tests:
          - not_null
      - name: has_zero_quantity_movement_review
        description: Flag indicating the daily stock fact row is associated with at least one zero-quantity stock movement that should be reviewed.
        data_tests:
          - not_null
      - name: snapshot_valid_from
        description: Snapshot validity window start timestamp.
        data_tests:
          - not_null
      - name: source_updated_at
        description: Source record last-update timestamp (updated_at from the stock level source).
      - name: snapshot_valid_to
        description: End of the snapshot validity window (null for the current/open record).
      - name: _ingested_at
        description: Ingestion timestamp.
        data_tests:
          - not_null
      - name: _source_origin
        description: Source system identifier.
        data_tests:
          - not_null
      - name: _batch_id
        description: Ingestion batch identifier.
        data_tests:
          - not_null
