version: 2

models:
  - name: dim_employees
    description: >
      Employee dimension. One record per employee.
    columns:
      - name: employee_id
        description: Employee natural key.
        data_tests:
          - not_null
          - unique
      - name: full_name
        description: Employee full name.
      - name: employee_role
        description: Employee role/position.
      - name: location_id
        description: Foreign key to the location the employee is primarily assigned to.
      - name: hire_date
        description: Date the employee was hired.
      - name: termination_date
        description: Date the employee was terminated, if applicable.
      - name: is_active_employee
        description: Whether the employee is currently active.