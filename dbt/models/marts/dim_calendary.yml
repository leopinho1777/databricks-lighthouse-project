version: 2

models:
  - name: dim_calendary
    description: >
      Calendar dimension built using dbt_utils.date_spine. Spans from 2020-01-01 
      up to the maximum ingestion date (or end of current year). The date range is
      contiguous by construction, with no gaps, so the table can be flagged as a
      date table in Power BI — a requirement for the Time Intelligence measures.
    columns:
      - name: date_id
        description: Integer representation of the date (YYYYMMDD). Primary key.
        data_tests:
          - not_null
          - unique
      - name: date_day
        description: The actual date format (YYYY-MM-DD).
        data_tests:
          - not_null
          - unique
      - name: year
        description: Year extracted from the date.
      - name: month
        description: Month number (1-12) extracted from the date.
      - name: month_name
        description: Full name of the month.
      - name: month_start
        description: The first day of the respective month.
      - name: quarter
        description: Quarter of the year (1-4).
      - name: day_of_week
        description: Day of the week (integer).
      - name: is_current_year
        description: Boolean flag indicating if the date belongs to the current ongoing year. Useful for Time Intelligence in BI.
      - name: is_previous_year
        description: Boolean flag indicating if the date belongs to the immediately preceding year.