version: 2

models:
  - name: agg_customer_monthly
    description: >
      Monthly aggregate table at the customer grain (Customer x Month). 
      Built using a date spine cross-join to ensure every month since the customer's 
      first purchase is represented, even if they made no purchases (zero-filled). 
      Ideal for cohort analysis, Monthly Recurring Revenue (MRR), and MoM retention charts.
    columns:
      - name: customer_monthly_sk
        description: Surrogate key for the aggregate, generated by hashing the customer_id and the reporting_month.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Natural key for the customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                severity: warn
      - name: person_type
        description: Customer type (PF or PJ) brought in for easy slicing in BI tools.
        data_tests:
          - not_null
      - name: reporting_month
        description: The first day of the reporting month.
        data_tests:
          - not_null
      - name: total_valid_orders
        description: Count of paid or confirmed orders placed by the customer in this specific month. Zero if no orders were placed.
        data_tests:
          - not_null
      - name: monthly_revenue
        description: Total gross revenue (line_total) generated by the customer in this specific month. Zero if no orders were placed.
        data_tests:
          - not_null
      - name: last_purchase_at
        description: Timestamp of the latest purchase made within this specific month. Null if the customer made no purchases.