version: 2

models:
  - name: agg_sales_regional_orders_daily
    description: >
      Daily order count aggregation at the Region (State) and Channel grain. 
      Built separately from the category aggregate to avoid fan-out (double-counting) 
      of orders that contain items from multiple categories.
    columns:
      - name: agg_sk
        description: Surrogate key for the aggregate row.
        data_tests:
          - not_null
          - unique
      - name: date_id
        description: Date of the sales (links to dim_calendary).
        data_tests:
          - not_null
      - name: channel
        description: Sales channel (e.g., ecommerce, physical store).
        data_tests:
          - not_null
      - name: customer_state
        description: State of the customer. Defaults to 'Não Informado' if unknown.
        data_tests:
          - not_null
      - name: daily_valid_orders
        description: Count of distinct paid or confirmed orders for this specific region and channel.
        data_tests:
          - not_null