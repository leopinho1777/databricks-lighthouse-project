version: 2

models:
  - name: agg_customer_metrics
    description: >
      Aggregate table with historical customer metrics. Calculates Lifetime Value (LTV), 
      first and last purchase dates, churn risk (inactive for > 540 days), and dynamic 
      ABC Curve classification based on revenue concentration. Grain: 1 row per customer.
    columns:
      - name: customer_id
        description: Natural key of the customer.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                severity: warn
      - name: first_purchase_date
        description: Date of the customer's very first order.
      - name: last_purchase_date
        description: Date of the customer's most recent order.
      - name: days_since_last_purchase
        description: Number of days elapsed between the last purchase and the current date.
      - name: is_churn_risk
        description: Boolean flag indicating if the customer is at risk of churning (inactive for more than 540 days / 18 months).
      - name: total_valid_orders
        description: Historical count of valid orders placed by the customer.
      - name: lifetime_gross_revenue
        description: Total gross revenue generated by the customer over their entire lifecycle (LTV).
      - name: abc_class
        description: >
          Customer classification based on the ABC Curve (Pareto Principle). 
          'A' = top 80% of revenue, 'B' = next 15%, 'C' = bottom 5%.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C']
      - name: person_type
        description: Indicates whether the customer is an individual (PF) or a company (PJ). Brought from dim_customers.
      - name: inferred_purchase_reason
        description: >
          Proxy for the purchase reason based on the customer profile. 
          'Professional Use' for corporate entities (PJ) and 'Leisure' for individuals (PF).