version: 2

models:
  - name: fct_purchases
    description: >
      Purchases fact at goods-receipt-item grain. Foreign keys to
      supplier, location, employee, and product dimensions. Measures
      for supplier reliability (delay, lead time) and currency-converted
      amounts (BRL).
    columns:
      - name: purchases_sk
        description: Surrogate key of the purchases fact.
        data_tests:
          - not_null
          - unique
      - name: goods_receipt_item_id
        description: Natural key — goods receipt item identifier.
        data_tests:
          - not_null
          - unique
      - name: supplier_sk
        description: Foreign key to the supplier dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_sk
              config:
                severity: warn
      - name: location_sk
        description: Foreign key to the location dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_sk
              config:
                severity: warn
      - name: product_variant_id
        description: Foreign key to the product dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_variant_id
              config:
                severity: warn
      - name: quantity_ordered
        description: Ordered quantity (additive measure).
        data_tests:
          - not_null
      - name: quantity_received
        description: Received quantity (additive measure).
        data_tests:
          - not_null
      - name: goods_receipt_id
        description: Parent goods receipt identifier.
      - name: purchase_order_item_id
        description: Related purchase order item key.
      - name: purchase_order_id
        description: Related purchase order key.
      - name: employee_id
        description: Employee who received the goods.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employees')
                field: employee_id
              config:
                severity: warn
      - name: po_number
        description: Human-readable purchase order reference number.
      - name: purchase_order_status
        description: Status of the purchase order at time of receipt.
      - name: currency
        description: Currency code of the original purchase order.
      - name: placed_at
        description: Timestamp when the purchase order was placed.
      - name: expected_delivery_at
        description: Expected delivery date from the purchase order.
      - name: received_by_employee_id
        description: Employee identifier of the goods receiver.
      - name: received_at
        description: Timestamp when the goods were received.
      - name: unit_cost
        description: Unit cost in the original purchase order currency.
      - name: line_total
        description: Line total in the original purchase order currency.
      - name: line_total_brl
        description: Line total converted to BRL (additive measure).
      - name: delay_days
        description: Days between expected and actual delivery.
      - name: lead_time_days
        description: Days between purchase order placement and receipt.