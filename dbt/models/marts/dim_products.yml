version: 2

models:
  - name: dim_products
    description: >
      Product dimension at variant grain. One record per sellable variant (SKU),
      with the corrected business category, brand, and reference measures
      (sale price, cost price, tax rates). Conformed dimension used by fct_sales.
    columns:
      - name: product_sk
        description: Surrogate key of the product dimension.
        data_tests:
          - not_null
          - unique
      - name: product_variant_id
        description: Natural key — sellable variant (grain of the table).
        data_tests:
          - not_null
          - unique
      - name: category_name
        description: Corrected business category (from int_products_categorized).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Motores','Eletrônica Náutica','Cabos','Hélices','Velas','Pintura Marítima','Âncoras','Acessórios de Convés','Segurança','Coletes Salva-Vidas','Não Classificado']
      - name: is_categorized
        description: Flag — true if category came from the curated map.
        data_tests:
          - not_null