# Pipeline completo do RAG, de ponta a ponta e idempotente: cria schema e tabelas, gera o
# corpus, fatia em chunks, garante o índice vetorial, sincroniza e dá ao app acesso ao índice.
# Um único `bundle run rag_ingestion` prepara o ambiente de quem fez o deploy, sem passos
# manuais. Reexecute sempre que a modelagem ou os docs/*.md mudarem.
resources:
  jobs:
    rag_ingestion:
      name: "LH Nautical RAG - Ingestion"

      email_notifications:
        on_failure:
          - teslavinci2026@gmail.com

      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema_gold
          default: "${var.schema_gold}"
        - name: schema_rag
          default: "${var.schema_rag}"
        - name: app_name
          default: "${resources.apps.lh_nautical_rag.name}"

      tasks:
        - task_key: setup
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            source: WORKSPACE

        - task_key: build_documents
          depends_on:
            - task_key: setup
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_build_documents.py
            source: WORKSPACE

        - task_key: build_chunks
          depends_on:
            - task_key: build_documents
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_build_chunks.py
            source: WORKSPACE

        - task_key: ensure_index
          depends_on:
            - task_key: build_chunks
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_create_index.py
            source: WORKSPACE

        - task_key: sync_index
          depends_on:
            - task_key: ensure_index
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_sync_index.py
            source: WORKSPACE

        - task_key: grant_app
          depends_on:
            - task_key: sync_index
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_grant_app.py
            source: WORKSPACE

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              # NOTA H6: a spec chama o SDK de "databricks-ai-search". Se o import
              # falhar no workspace, o pacote equivalente é "databricks-vectorsearch"
              # (from databricks.vector_search.client import VectorSearchClient).
              - databricks-ai-search
              - pyyaml>=6.0
              - databricks-sdk>=0.60.0

      max_concurrent_runs: 1
      queue:
        enabled: true
