resources:
  jobs:
    transformation_job:
      name: transformation-job

      tasks:
        - task_key: dbt_build
          environment_key: default

          dbt_task:
            project_directory: ../../../dbt
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.schema}

            commands:
              - dbt deps
              - dbt build

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0