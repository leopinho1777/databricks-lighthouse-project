resources:
  jobs:
    ingestion_orchestration:
      name: "LH Nautical Orchestration"

      tasks:
        - task_key: ingestion
          run_job_task:
            job_id: "839993403908453"
        - task_key: transformation
          max_retries: 2
          depends_on:
            - task_key: ingestion
          run_job_task:
            job_id: "839993403908453"

      schedule:
        quartz_cron_expression: "0 0 1 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      max_concurrent_runs: 1