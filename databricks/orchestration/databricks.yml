bundle:
  name: orchestration
  uuid: f6b5dda6-47e0-4e97-8818-2ce1d40fcc1c

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:

    mode: development
    default: true
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-fc67e327-d40e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gabrielhs336@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gabrielhs336@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lh_nautical
      schema: prod
    permissions:
      - user_name: gabrielhs336@gmail.com
        level: CAN_MANAGE
