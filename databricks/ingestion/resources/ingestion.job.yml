resources:
  #Job de ingestão formado por 4 tasks, onde uma depende do sucesso da anterior
  jobs:
    ingestion:
      name: SQL Server Ingestion
      tasks:

        #Task setup - cria catalog, schema, tabelas de audit e control e disponibiliza lista de tabelas para ingestão
        - task_key: setup
          notebook_task:
            notebook_path: ../src/sqlserver_ingest_setup.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          environment_key: Default

        #Task ingest_tables - ingestão através de for_each para cada tabela disponibilizada por 'setup'
        - task_key: ingest_tables
          depends_on:
            - task_key: setup         
          for_each_task:
            #Consome o nome da tabela vindo da task 'setup'
            inputs: "{{tasks.setup.values.tables}}"
            concurrency: 5
            task:
              task_key: ingest_single_table
              notebook_task:
                notebook_path: ../src/sqlserver_ingest.ipynb
                source: WORKSPACE
                base_parameters:
                  #input contendo o nome e a(s) chave(s) da tabela
                  table_config: "{{input}}"
                  governance_config_path: "governance_config.json"
                  catalog: "${var.catalog}"
                  schema: "${var.schema}"
        #Task apply_rbca - Fornece acesso de acordo com o role (role- based access control)
        - task_key: ingest_bcb_exchange_rates
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/bcb_exchange_rates_ingest.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          environment_key: Default

        #Task check_bcb_consecutive_failures - só roda se ingest_bcb_exchange_rates falhar;
        #falha de propósito na 3a falha consecutiva para acionar o email nativo de on_failure
        - task_key: check_bcb_consecutive_failures
          depends_on:
            - task_key: ingest_bcb_exchange_rates
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../src/check_bcb_consecutive_failures.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          environment_key: Default
          email_notifications:
            on_failure:
              - teslavinci2026@gmail.com

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
