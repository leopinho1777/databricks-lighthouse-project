# This is a Databricks asset bundle definition for grupo10.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grupo10
  uuid: 91df96da-8a72-438c-9944-e80f4e6ad10b

include:
  - resources/ingestion.job.yml
  - ../../databricks.local.yml

artifacts:
  python_artifact:
    type: whl
    path: ../..
    build: uv build --wheel

sync:
  include:
  - "src/**"

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  dev_schema:
    description: "Schema usado no ambiente de dev"
    default: "bronze"

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: develop
      schema: ${var.dev_schema}

  prod:
    mode: production
    workspace:
      host: https://dbc-fc67e327-d40e.cloud.databricks.com/
      root_path: /Workspace/Users/teslavinci2026@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lh_nautical
      schema: prod
    permissions:
      - user_name: teslavinci2026@gmail.com
        level: CAN_MANAGE